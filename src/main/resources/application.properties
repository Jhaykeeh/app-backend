# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/reactdb
spring.datasource.username=root
spring.datasource.password=csit*321
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=YourSuperSecretKeyThatIsAtLeast256BitsLongForSecurityPurposes123456
jwt.expiration=86400000

# Email Configuration (for Forgot Password)
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=your-email@gmail.com
#spring.mail.password=your-app-password
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# Error handling
server.error.include-message=always

# SQL initialization (runs data-admin.sql on startup for admin seed)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-admin.sql

# Logging
logging.level.org.springframework.security=DEBUG