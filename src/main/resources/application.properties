# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/appdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=csit*321
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SQL initialization runs AFTER Hibernate DDL
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data-admin.sql

# JWT Configuration
jwt.secret=YourSuperSecretKeyThatIsAtLeast256BitsLongForSecurityPurposes123456
jwt.expiration=86400000

# Error handling
server.error.include-message=always

# Logging
logging.level.org.springframework.security=DEBUG